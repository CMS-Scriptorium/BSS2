<div class="grid">
	<div class="unit whole align-right">
		<span class="mod_bakery_cart_subtotal_f">
			{TXT_SUBTOTAL}: 
			{SETTING_SHOP_CURRENCY}&nbsp;{ORDER_SUBTOTAL}
		</span>
	</div>
</div>
<div class="grid">
	<div class="unit whole align-right">
		<span class="{CSS_CLASS_CART_SHIPPING}">
			{TXT_SHIPPING_COST}: 
			{SETTING_SHOP_CURRENCY}&nbsp;{SHIPPING}
		</span>
	</div>
</div>
<div class="grid">
	<div class="unit whole align-right" style="display: {DISPLAY_TAX}">
		<span class="mod_bakery_cart_tax_f">
			{TXT_INCL} {TAX_RATE} {TXT_TAX}:
			{SETTING_SHOP_CURRENCY}&nbsp;{SALES_TAX}
		</span>
	</div>
</div>
<div class="grid mod_bakery_sum">
	<div class="unit whole align-right">
		<span class="mod_bakery_cart_total_f">
		{TXT_TOTAL}:
		{SETTING_SHOP_CURRENCY}&nbsp;{ORDER_TOTAL}
	</div>
</div>
<div class="grid">	
	<div class="unit whole align-center">
		<form action="{CHECKOUT_URL}" method="post">
			<input type="submit" name="checkout" class="mod_bakery_bt_buy_f" value="{TXT_BUY}" />
			{PAY_GATEWAY_DATA}
		</form>
	</div>
</div>
<hr />
<div class="grid">
	<form action="{SETTING_CONTINUE_URL}" method="post">
		<div class="unit half hide-on-mobiles">
			<input type="submit" name="continue_shopping" class="mod_bakery_bt_continue_f" value="{TXT_CONTINUE_SHOPPING}" /> 
		</div>
		<div class="unit half align-right  hide-on-mobiles">
			<input type="submit" name="cancel_order" class="mod_bakery_bt_cancel_f" value="{TXT_CANCEL_ORDER}" onclick="javascript: return confirm('{TXT_JS_CONFIRM}')" />
		</div>
		<div class="unit whole only-on-mobiles align-center">
		<input type="submit" name="continue_shopping" class="mod_bakery_bt_continue_f" value="{TXT_CONTINUE_SHOPPING}" /> <br /><br />
		<input type="submit" name="cancel_order" class="mod_bakery_bt_cancel_f" value="{TXT_CANCEL_ORDER}" onclick="javascript: return confirm('{TXT_JS_CONFIRM}')" />
		</div>
	</form>
</div>
