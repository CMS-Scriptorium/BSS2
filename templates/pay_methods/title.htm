
<h2 class="mod_bakery_h_f">
	<img src="{WB_URL}/modules/bakery/images/checkout_steps/step_2.png" alt="{TXT_TAC_AND_PAY_METHOD}" />
	{TXT_TAC_AND_PAY_METHOD}
</h2>
<p id="txt_js_agree" style="display: none;">{TXT_JS_AGREE}</p>

<form action="{SETTING_CONTINUE_URL}" method="post">
<input type="hidden" name="summary" value="true" />

<div class="grid">
	<div class="unit whole" style="display: {DISPLAY_AGREE};">		
			<hr class="mod_bakery_hr_f" />
			<div class="mod_bakery_agree_f" id="agree">
				<div style="display: {DISPLAY_TAC};" class="mod_bakery_tac_f">
					<input type="checkbox" name="tac" id="tac" value="yes" /> 
					{TAC_LINK}<br />
					<input type="checkbox" name="cancellation" id="cancellation" required="required" value="yes" />
					{CANCELLATION_LINK}<br />
					<input type="checkbox" name="privacy" id="privacy" required="required" value="yes" />
					{PRIVACY_LINK}<br />
				</div>
				<div style="display: {DISPLAY_NO_REVOCATION};" class="mod_bakery_no_revocation_f">
					<input type="checkbox" name="no_revocation" id="no_revocation" value="yes" /> 
					<span>{TXT_NO_REVOCATION}</span>
				</div>
			</div>
		</div>	
	<div class="unit whole" style="display: {DISPLAY_CUST_MSG};">		
			<hr class="mod_bakery_hr_f" />
			<p class="mod_bakery_cust_msg_f">{TXT_ENTER_CUST_MSG}:</p>
			<textarea name="cust_msg" class="mod_bakery_cust_msg_ta_f">{CUST_MSG}</textarea>
	</div>
	<div class="unit whole">
			<hr class="mod_bakery_hr_f" />
			<p class="mod_bakery_pay_method_f">{TXT_PAY_METHOD}:</p>
	</div>	
</div>
